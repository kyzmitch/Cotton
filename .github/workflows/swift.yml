name: Cotton-iOS

on:
  pull_request:
    branches: [ "develop" ]
    types: [opened, reopened]
    paths:
      - "catowseriOS/.swiftlint.yml"
      - "catowseriOS/**/*.swift"
      - "cotton-base/**/*.kt"

jobs:
  lint-ios:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
      with:
        ref: ${{ github.event.pull_request.head.sha }}
    - name: SwiftLint (all swift files)
      uses: norio-nomura/action-swiftlint@3.2.1
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }} # Обязательно для Reviewdog
        args: --force-exclude --config catowseriOS/.swiftlint.yml
  lint-kotlin-cotton-base:
    runs-on: ubuntu-latest
    steps:
      - name: "checkout"
        uses: actions/checkout@v3
      - name: Copy editorconfig
        run: cp cotton-base/.editorconfig .editorconfig
      - name: ktlint
        uses: ScaCap/action-ktlint@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          args: --editorconfig=cotton-base/.editorconfig --disabled_rules=indent,final-newline,trailing-comma,trailing-comma-on-call-site,trailing-comma-on-declaration-site,colon-spacing --verbose --no-wildcard-imports
          patterns: cotton-base/**/*.kt
          reporter: github-check
  ios-unit-tests:
    needs: [lint-ios, lint-kotlin-cotton-base]
    runs-on: macos-26
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5'
      - uses: actions/cache@v3
        with:
          path: .mint
          key: ${{ runner.os }}-mint-${{ hashFiles('**/Mintfile') }}
          restore-keys: |
            ${{ runner.os }}-mint-
      - uses: actions/cache@v3
        with:
          path: catowseriOS/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
              ${{ runner.os }}-spm-
      - uses: actions/checkout@v3
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
      - uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys:  |
            ${{ runner.os }}-gradle-
      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@ccb4328a959376b642e027874838f60f8e596de3
      - name: Build
        run: make github-ios-unit-tests
  build-ios:
    needs: [ios-unit-tests]
    runs-on: macos-26
    env:
      MINT_PATH: .mint/lib
      MINT_LINK_PATH: .mint/bin
    steps:
    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.5'
    - uses: actions/cache@v3
      with:
        path: .mint
        key: ${{ runner.os }}-mint-${{ hashFiles('**/Mintfile') }}
        restore-keys: |
          ${{ runner.os }}-mint-
    - uses: actions/cache@v3
      with:
        path: catowseriOS/SourcePackages
        key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
        restore-keys: |
            ${{ runner.os }}-spm-
    - uses: actions/checkout@v3
    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
    - uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys:  |
          ${{ runner.os }}-gradle-
    - name: Validate Gradle wrapper
      uses: gradle/wrapper-validation-action@ccb4328a959376b642e027874838f60f8e596de3
    - name: Build
      run: make github-workflow-ios
